<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Island 3D</title><style>/*__CSS__*/</style></head>
<body>
<canvas id="gl"></canvas>
<header id="top">
  <div class="brand">🏝️ <b>Bot Island</b> <span class="three">3D</span></div>
  <div class="seg" id="modes"><button data-mode="live" class="on">● Live</button><button data-mode="replay">⏪ Replay</button></div>
  <select id="day" title="Replay day (ET)"></select>
  <button id="play" title="Play / pause (space)">⏸</button>
  <select id="speed" title="Speed"><option value="1">1×</option><option value="60">60×</option><option value="300">5 min/s</option><option value="1800">30 min/s</option></select>
  <button id="tour" title="Auto-tour (t)">🎥 Tour</button>
  <button id="labels" title="Show all labels (l)">🏷️ Labels</button>
  <div class="clock"><div id="clock">…</div><div id="sun" class="sub"></div></div>
</header>
<aside id="side">
  <div class="card" id="fuelcard"></div>
  <div class="card"><h3 id="cnt-title">Replayed events</h3><div id="counts"></div></div>
  <div class="card wire"><h3>📡 Island wire</h3><ol id="wire"></ol></div>
</aside>
<footer id="scrub">
  <div class="tl"><canvas id="hist"></canvas><input id="range" type="range" min="0" max="1440" step="0.25" value="0" aria-label="time of day"></div>
  <div class="ticks"><span>12 AM</span><span>6 AM</span><span>Noon</span><span>6 PM</span><span>12 AM</span></div>
</footer>
<div id="tip"></div><div id="labelsLayer"></div><div id="banner"></div>
<script>/*__THREE__*/</script>
<script>window.BOT_ISLAND_3D_DATA = /*__DATA__*/;</script>
<script>/*__APP__*/</script>
</body></html>
